<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-OS | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-navbar">
        <div class="nav-brand"><a href="index.html" style="color: inherit; text-decoration: none;">Z-OS <span class="blue-dot">.</span></a></div>
        <button class="mobile-menu-btn" id="mobile-toggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <ul class="nav-links" id="nav-menu">
            <li><a href="about.html">About Us & Project</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="login.html" class="btn-primary">Login / Profile</a></li>
        </ul>
    </nav>

    <main class="core-container">
        <div class="terminal-box" style="max-width: 500px;">
            <header class="term-header">
                <div class="status-wrap">
                    <div class="pulse-ring" style="border-color: var(--error-red);"><div class="core-dot" style="background: var(--error-red);"></div></div>
                    <span class="status-text" style="color: var(--error-red);">SYSTEM LOCKED : AUTH REQUIRED</span>
                </div>
            </header>

            <section class="page-content" style="align-items: center; justify-content: center; text-align: center;">
                <h1 class="page-title" style="border: none; margin-bottom: 0;">Terminal Access</h1>
                <p class="page-text" style="margin-bottom: 30px;">Authenticate credentials to unlock local machine control.</p>
                
                <form class="os-form" style="width: 100%;" onsubmit="event.preventDefault(); window.location.href='index.html';">
                    <input type="text" class="form-input" placeholder="[ ROOT_USERNAME ]" required>
                    <input type="password" class="form-input" placeholder="[ PASSWORD_HASH ]" required>
                    <button type="submit" class="btn-primary" style="margin-top: 10px;">Bypass Firewall & Login</button>
                </form>
                
                <p class="page-text" style="margin-top: 20px; font-size: 13px;">
                    No credentials found? <a href="signup.html" style="color: var(--primary-blue); text-decoration: none;">Initialize Account -></a>
                </p>
            </section>
        </div>
    </main>

    <script>
        // MOBILE NAV ENGINE
        const mobileToggle = document.getElementById('mobile-toggle');
        const navMenu = document.getElementById('nav-menu');
        mobileToggle.addEventListener('click', () => { navMenu.classList.toggle('show'); });
    </script>
</body>
</html>
